          { k: 'rate_dual', name: 'Rate Dual 2A',   color: '#9ceee6', u: 'Å/s', d: 2, dash: [5, 4] } ] },
      { label: 'Power (%)', series: [
          { k: 'power_ti',  name: 'Ti power',       color: '#f6ad55', u: '%', d: 2, dash: [6, 4] },
          { k: 'power_al',  name: 'Al power',       color: '#fcd9a4', u: '%', d: 2 } ] },
      { label: 'Thickness (Å)', series: [
          { k: 'thickness_ti', name: 'Ti thickness', color: '#b794f4', u: 'Å', d: 1, dash: [6, 4] },
          { k: 'thickness_al', name: 'Al thickness', color: '#dcc8fb', u: 'Å', d: 1 } ] },
      { label: 'Pressure (Torr)', log: true, series: [
          { k: 'pressure_evap',   name: 'Evap chamber',  color: '#63b3ed', u: 'Torr' },
          { k: 'pressure_ox_ch',  name: 'Ox chamber',    color: '#81d4fa', u: 'Torr' },
          { k: 'pressure_ox',     name: 'Ox process',    color: '#aed4f7', u: 'Torr', dash: [5, 4] } ] },
    ],

    tsLanes: [
      { k: 'shutter',        name: 'Substrate shutter',  color: '#4fd1c5' },
      { k: 'ti_src_shutter', name: 'Ti source shutter',  color: '#f6ad55' },
      { k: 'al_src_shutter', name: 'Al source shutter',  color: '#b794f4' },
      { k: 'kdc_shutter',    name: 'KDC ion shutter',    color: '#fc8181' },
      { k: 'mc1_shutter',    name: 'MC1 sensor shutter', color: '#68d391' },
      { k: 'dual_shutter',   name: 'Dual sensor shutter',color: '#63b3ed' },
    ],

    valveLanes: [
      { k: 'substrate_shutter',  name: 'Substrate shutter',  color: '#4fd1c5' },
      { k: 'substrate_cmd',      name: 'Substrate cmd',      color: '#3ab0a5' },
      { k: 'ti_source_shutter',  name: 'Ti source shutter',  color: '#f6ad55' },
      { k: 'al_source_shutter',  name: 'Al source shutter',  color: '#b794f4' },
      { k: 'kdc_ion_shutter',    name: 'KDC ion shutter',    color: '#fc8181' },
      { k: 'mc1_sensor_shutter', name: 'MC1 sensor shutter', color: '#68d391' },
      { k: 'dual_sensor_shutter',name: 'Dual sensor shutter',color: '#63b3ed' },
    ],

    cmpGroups: [
      { name: 'Ti gettering', metrics: [
          ['ti_thickness', 'Thickness'], ['ti_rate_mean', 'Rate (MC1)'], ['ti_power_mean', 'Power'] ] },
      { name: 'Al 1st', metrics: [
          ['al1_thickness', 'Thickness'], ['al1_rate_mean', 'Rate (MC1)'], ['al1_rate_dual', 'Rate (Dual 2A)'] ] },
      { name: 'Junction oxidation', metrics: [
          ['jox_pressure', 'Pressure'], ['jox_duration', 'Duration'] ] },
      { name: 'Al 2nd', metrics: [
          ['al2_thickness', 'Thickness'], ['al2_rate_mean', 'Rate (MC1)'] ] },
      { name: 'Capping oxidation', metrics: [
          ['cap_pressure', 'Pressure'], ['cap_duration', 'Duration'] ] },
      { name: 'System', metrics: [
          ['base_pressure', 'Base pressure'], ['mc1_remaining', 'MC1 crystal remaining'] ] },
    ],
  };

})();

/* ======================================================================
 *  5. Ta sputterer module
 * ====================================================================== */

(function() {

  // A phase is heating (1–2), sputtering (3–5) or cooldown (6–7).
  // Field presence overrides the numeric convention so unusual recipes still classify sensibly.
  function phaseKind(P) {
    const n = P.phase;
    const hasSput = P.sputter_power != null || P.sputter_voltage != null ||
                    P.rate_mean != null || P.thickness_final != null;
    if (hasSput) return 'sput';
    if (n >= 6 || /cool/i.test(P.name || '')) return 'cool';
    if (n >= 3 && n <= 5) return 'sput';
    return 'heat';
  }

  function tempRangeHTML(a, b) {
    const f = v => v == null || !isFinite(v) ? '—' : v.toFixed(0);
    return `${f(a)}<span class="arr">→</span>${f(b)}<span class="unit">°C</span>`;
  }

  function sparkHTML(n) {
    const cls = n === 0 ? 'ok' : n <= 5 ? 'warn' : 'bad';
    const txt = n === 0 ? 'none during phase' : `+${n} during phase`;
    return metricHTML('Sparks', String(n),
      `<div class="m-delta ${cls}"><span class="dot"></span>${txt}</div>`);
  }

  function calChipHTML(P, material) {
    const cal = P.calibration;
    if (!cal) return '';
    const tf   = cal.tooling  ?? cal.tooling_factor ?? cal.mc1_tooling;
    const rho  = cal.density  ?? cal.mc1_density;
    const z    = cal.zfactor  ?? cal.z_factor ?? cal.mc1_zfactor;
    const xtal = cal.crystal  ?? cal.crystal_life ?? cal.mc1_crystal;
    const bits = [];
    if (tf  != null) bits.push(`TF ${tf}`);
    if (rho != null) bits.push(`ρ ${rho}`);
    if (z   != null) bits.push(`Z ${z}`);
    if (xtal != null) bits.push(`xtal ${xtal}`);
    if (!bits.length) return '';
    return `
      <details class="cal" onclick="event.stopPropagation()">
        <summary>CAL</summary>
        <div class="cal-pop">
          <div class="cal-mat">${esc(material || 'Sensor')}</div>
          <div><span class="cal-lbl">QCM</span>${bits.join(' · ')}</div>
        </div>
      </details>`;
  }

  function renderSummary(data) {
    const info = data.run_info || {};
    let html = `
      <div class="run-info-bar">
        <div class="metric"><div class="m-label">Run date</div><div class="m-value">${esc(info.date ?? '—')}</div></div>
        ${info.recipe_name ? `<div class="metric"><div class="m-label">Recipe</div><div class="m-value" style="font-family:var(--sans);font-size:14px">${esc(info.recipe_name)}</div></div>` : ''}
        ${info.material ? `<div class="metric"><div class="m-label">Material</div><div class="m-value" style="font-family:var(--sans);font-size:14px">${esc(info.material)}</div></div>` : ''}
        <div class="metric"><div class="m-label">Total duration</div><div class="m-value">${fmtDur(info.total_duration)}</div></div>
        <div class="metric"><div class="m-label">Base pressure</div><div class="m-value">${info.base_pressure != null ? withUnit(sciHTML(info.base_pressure), 'Torr') : '—'}</div></div>
      </div>
      <div class="timeline">`;

    for (const P of (data.phases || [])) {
      const kind = phaseKind(P);
      const m = [];

      if (kind === 'sput') {
        if (P.dc_mode)
          m.push(metricHTML('Mode', `<strong>${esc(P.dc_mode)}</strong>${P.pulse_freq_hz ? ` (${P.pulse_freq_hz} Hz)` : ''}`));
        if (P.sputter_power != null)
          m.push(metricHTML('Power', withUnit(fmtVal(P.sputter_power, 'W'), 'W')));
        if (P.sputter_voltage != null)
          m.push(metricHTML('Voltage', withUnit(fmtVal(P.sputter_voltage, 'V'), 'V')));
        if (P.sputter_current != null)
          m.push(metricHTML('Current', withUnit(fmtVal(P.sputter_current, 'mA'), 'mA')));
        if (P.rate_mean != null)
          m.push(metricHTML('Rate',
            `${fmtVal(P.rate_mean, 'Å/s')}${P.rate_std != null ? ` ± ${P.rate_std.toFixed(2)}` : ''}<span class="unit">Å/s</span>`,
            deltaHTML(P.rate_mean, P.rate_setpoint, 'Å/s', 2)));
        if (P.thickness_final != null)
          m.push(metricHTML('Thickness', withUnit(fmtVal(P.thickness_final, 'Å'), 'Å'),
            deltaHTML(P.thickness_final, P.thickness_target, 'Å', 1)));
        if (P.ar_flow != null)
          m.push(metricHTML('Ar flow', withUnit(fmtVal(P.ar_flow, 'sccm'), 'sccm')));
        if (P.substrate_temp != null)
          m.push(metricHTML('Substrate temp', withUnit(fmtVal(P.substrate_temp, '°C'), '°C')));
        if (P.spark_count_delta != null)
          m.push(sparkHTML(P.spark_count_delta));
        if (P.duration != null)
          m.push(metricHTML('Duration', fmtDur(P.duration)));
      } else {
        // heating / cooldown phases: temperature profile dominates
        if (P.temp_start != null || P.temp_end != null)
          m.push(metricHTML('Temperature', tempRangeHTML(P.temp_start, P.temp_end)));
        if (kind === 'heat' && P.temp_max != null)
          m.push(metricHTML('Max temp', withUnit(fmtVal(P.temp_max, '°C'), '°C')));
        if (P.heater_power_mean != null)
          m.push(metricHTML('Heater power', withUnit(fmtVal(P.heater_power_mean, '%'), '%')));
        if (P.substrate_temp != null)
          m.push(metricHTML('Substrate temp', withUnit(fmtVal(P.substrate_temp, '°C'), '°C')));
        if (P.duration != null)
          m.push(metricHTML('Duration', fmtDur(P.duration)));
      }

      const tag = kind === 'heat' ? '<span class="lc-tag heat">HEATING</span>'
                : kind === 'sput' ? '<span class="lc-tag sput">SPUTTER</span>'
                : '<span class="lc-tag cool">COOLDOWN</span>';
      const calHtml = kind === 'sput' ? calChipHTML(P, info.material) : '';

      html += `
        <div class="phase-card ph-${kind} clickable" data-seg="${P.phase}" title="Click to view this phase in Time Series">
          <div class="tl-dot"></div>
          ${calHtml}
          <div class="lc-head">
            <div class="lc-name">${esc(P.name ?? `Phase ${P.phase}`)}</div>
            <div class="lc-mat">phase ${P.phase}</div>
            ${tag}
          </div>
          <div class="lc-metrics">${m.join('')}</div>
        </div>`;
    }
    html += '</div>';
    return html;
  }

  MACHINE_DEFS.ta = {
    name: 'Ta Sputterer',
    accent: '#f6ad55',
    accentRGB: '246,173,85',
    zoomKey: 'phase',                          // summary card → time-series zoom
    shutterBand: 'rgba(252,129,129,0.06)',     // deposition-window band
    renderSummary,

    /*
     * Panels use a left axis, plus an optional right axis (cfg.right) for a
     * second quantity whose scale differs by orders of magnitude.
     * Series formatting hints: u = unit for tooltip, d = decimals for tooltip.
     */
    panels: [
      { label: 'Temperature (°C)', series: [
          { k: 'heater_temp', name: 'Heater temp',      color: '#fc8181', u: '°C', d: 0 },
          { k: 'pyro_temp',   name: 'Pyro temp (kSA)',  color: '#feb2b2', u: '°C', d: 0, dash: [5, 4] } ],
        right: { label: 'Reflectivity (%)', series: [
          { k: 'reflectivity', name: 'Reflectivity',    color: '#b794f4', u: '%', d: 1, dash: [2, 3] } ] } },
      { label: 'Sputter (W / V)', series: [
          { k: 'sputter_power_w', name: 'Power',        color: '#f6ad55', u: 'W', d: 1 },
          { k: 'sputter_voltage', name: 'Voltage',      color: '#fcd9a4', u: 'V', d: 1, dash: [6, 4] } ],
        right: { label: 'Current (mA)', series: [
          { k: 'sputter_current', name: 'Current',      color: '#f6ad55', u: 'mA', d: 0, dash: [2, 3] } ] } },
      { label: 'Rate (Å/s)', series: [
          { k: 'rate', name: 'QCM rate',                color: '#4fd1c5', u: 'Å/s', d: 2 },
          { k: 'cal_rate', name: 'Calibrated rate',     color: '#68d391', u: 'Å/s', d: 2, dash: [6, 4] } ],
        right: { label: 'Thickness (Å)', series: [
          { k: 'thickness', name: 'QCM thickness',      color: '#9ceee6', u: 'Å', d: 1, dash: [4, 3] },
          { k: 'cal_thickness', name: 'Film thickness', color: '#f0fff4', u: 'Å', d: 1 } ] } },
      { label: 'Pressure (Torr)', log: true, series: [
          { k: 'pressure', name: 'Chamber pressure',    color: '#63b3ed', u: 'Torr' } ],
        right: { label: 'Ar flow (sccm)', series: [
          { k: 'ar_flow', name: 'Ar flow',              color: '#68d391', u: 'sccm', d: 1, dash: [5, 4] } ] } },
    ],

    tsLanes: [
      { k: 'shutter',        name: 'Substrate shutter', color: '#4fd1c5' },
      { k: 'src_shutter',    name: 'Source shutter',    color: '#f6ad55' },
      { k: 'sensor_shutter', name: 'Sensor shutter',    color: '#68d391' },
    ],

    valveLanes: [
      { k: 'substrate_shutter', name: 'Substrate shutter', color: '#4fd1c5' },
      { k: 'substrate_cmd',     name: 'Substrate cmd',     color: '#3ab0a5' },
      { k: 'source_shutter',    name: 'Source shutter',    color: '#f6ad55' },
      { k: 'sensor_shutter',    name: 'Sensor shutter',    color: '#68d391' },
    ],

    cmpGroups: [
      { name: 'Deposition', metrics: [
          ['dep_rate', 'Rate'], ['rate_mean', 'Rate'],
          ['thickness', 'Thickness'], ['thickness_final', 'Thickness'], ['dep_thickness', 'Thickness'],
          ['dep_duration', 'Deposit duration'] ] },
      { name: 'Sputter supply', metrics: [
          ['sputter_power', 'Power'], ['sputter_voltage', 'Voltage'], ['sputter_current', 'Current'],
          ['spark_count', 'Spark count'], ['sparks', 'Spark count'] ] },
      { name: 'Substrate', metrics: [
          ['substrate_temp', 'Substrate temp'], ['dep_substrate_temp', 'Substrate temp (dep)'],
          ['heater_power', 'Heater power'], ['temp_max', 'Max temp'] ] },
      { name: 'Gas & vacuum', metrics: [
          ['ar_flow', 'Ar flow'], ['base_pressure', 'Base pressure'] ] },
      { name: 'System', metrics: [
          ['crystal_life', 'Crystal life'], ['xtal_remaining', 'Crystal remaining'],
          ['crystal_remaining', 'Crystal remaining'], ['total_duration', 'Total duration'] ] },
    ],
  };

})();

/* ======================================================================
 *  6. Machine switching + init
 * ====================================================================== */

function normalizeMachines(raw) {
  const list = Array.isArray(raw) ? raw : (raw && raw.machines) || [];
  return list.map(m => {
    const id = m.id ?? m.machine ?? m.key;
    const def = MACHINE_DEFS[id];
    return {
      id,
      name: m.name || m.label || (def && def.name) || String(id),
      accent: m.accent || m.accent_color || m.color || (def && def.accent) || '#4fd1c5',
    };
  }).filter(m => m.id != null);
}

function fallbackMachines() {
  return Object.entries(MACHINE_DEFS).map(([id, d]) => ({ id, name: d.name, accent: d.accent }));
}

function applyMachineTheme() {
  const m = state.machines.find(x => x.id === state.machine);
  const def = machineDef();
  const accent = (m && m.accent) || (def && def.accent) || '#4fd1c5';
  const rgb = hexToRGB(accent);
  if (def) { def.accent = accent; def.accentRGB = rgb; }
  document.documentElement.style.setProperty('--machine-accent', accent);
  document.documentElement.style.setProperty('--machine-accent-rgb', rgb);
  document.title = 'Angstrom Log Viewer' + (m ? ' — ' + m.name : '');
}

const machineToggle = document.getElementById('machineToggle');

function buildMachineToggle() {
  machineToggle.innerHTML = state.machines.map(m =>
    `<button data-machine="${esc(m.id)}" role="tab" title="${esc(m.name)}">${esc(m.name)}</button>`).join('');
  updateMachineToggle();
}

function updateMachineToggle() {
  machineToggle.querySelectorAll('button').forEach(b => {
    const active = b.dataset.machine === state.machine;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  });
}

machineToggle.addEventListener('click', e => {
  const btn = e.target.closest('button[data-machine]');
  if (btn && btn.dataset.machine !== state.machine) setMachine(btn.dataset.machine);
});

// hash is the source of truth for bookmarks: #jj / #ta
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && id !== state.machine && state.machines.some(x => x.id === id)) setMachine(id);
});

function setMachine(id) {
  if (id === state.machine) return;
  state.machine = id;
  state.runs = [];
  state.runId = null;
  state.pendingZoomSeg = null;
  state.cmpSelectedIds.clear();
  state.collapsedGroups.clear();
  clearCaches();
  activeChart = null;
  activeValveChart = null;
  Object.values(views).forEach(v => { v.innerHTML = ''; });
  runSelect.innerHTML = '';
  runSelect.disabled = true;
  applyMachineTheme();
  updateMachineToggle();
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  setTab('summary');       // machine switch always resets to Summary
  loadRuns();
}

async function loadRuns() {
  const m = state.machine;
  runSelect.disabled = false;
  showLoading(views.summary);
  let runs;
  try { runs = await fetchJSON(api('/runs')); }
  catch (err) {
    if (state.machine !== m) return;
    runSelect.disabled = true;
    runSelect.innerHTML = '';
    showError(views.summary, err);
    return;
  }
  if (state.machine !== m) return;   // machine changed while loading
  state.runs = runs;
  if (!runs.length) {
    runSelect.disabled = true;
    runSelect.innerHTML = '';
    views.summary.innerHTML = '<div class="center-msg">No runs found</div>';
    return;
  }
  runSelect.innerHTML = runs.map(runOptionHTML).join('');
  state.runId = runs[runs.length - 1].id;   // default: latest
  runSelect.value = state.runId;
  render();
}

async function init() {
  try {
    state.machines = normalizeMachines(await fetchJSON('/api/machines'));
  } catch (err) {
    state.machines = [];
  }
  if (!state.machines.length) state.machines = fallbackMachines();
  if (!state.machines.length) {
    views.summary.innerHTML = '<div class="center-msg">No machines available</div>';
    runSelect.disabled = true;
    return;
  }
  buildMachineToggle();

  const hashId = location.hash.slice(1);
  const startId = state.machines.some(m => m.id === hashId) ? hashId : state.machines[0].id;
  state.machine = startId;
  applyMachineTheme();
  updateMachineToggle();
  if (location.hash.slice(1) !== startId) history.replaceState(null, '', '#' + startId);
  loadRuns();
}

/* ================= go ================= */
init();
</script>
